name: zenmanage
description: Official Dart/Flutter SDK for Zenmanage feature flags with local evaluation. Control feature rollouts, A/B test, and manage configurations without deploying code.
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  coverage: ^1.15.1
  shared_preferences_platform_interface: ^2.4.0

flutter:

homepage: https://github.com/zenmanage/zenmanage-flutter
repository: https://github.com/zenmanage/zenmanage-flutter
issue_tracker: https://github.com/zenmanage/zenmanage-flutter/issues
documentation: https://github.com/zenmanage/zenmanage-flutter/blob/main/README.md

topics:
  - feature-flags
  - feature-toggles
  - ab-testing
  - experiments
  - remote-config
