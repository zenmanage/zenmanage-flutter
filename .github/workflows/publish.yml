name: Publish to pub.dev

# Publishes to pub.dev when a version tag is pushed, using GitHub's OIDC token
# (no stored credentials). pub.dev only accepts automated publishes triggered
# by a tag push, and the tag must match the pattern set in the package's
# Admin tab on pub.dev: v{{version}}.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches pubspec.yaml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Strip optional quotes: `version: "1.0.1"` is valid YAML too.
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1 | tr -d "'\"")"
          echo "Tag: ${TAG_VERSION}, pubspec.yaml: ${PUBSPEC_VERSION}"
          if [[ "${TAG_VERSION}" != "${PUBSPEC_VERSION}" ]]; then
            echo "The tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${PUBSPEC_VERSION}"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # dart-lang's reusable workflow installs Flutter, builds the package archive
  # and publishes it with the OIDC token it sets up itself. A plain
  # `flutter pub publish` here falls back to an interactive Google sign-in.
  publish:
    needs: check
    permissions:
      contents: read # The reusable workflow's jobs can't be granted more than this
      id-token: write # Required for OIDC token minting
    # Matches the optional "Require GitHub Actions environment" setting on
    # pub.dev. Add required reviewers to this environment in the repo settings
    # to gate each publish behind an approval.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      environment: pub.dev
